<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ATEM ⇄ OBS</title>
<style>
:root {
  --bg:         #1e1f28;
  --surface:    #252730;
  --border:     #3a3c4a;
  --text:       #eeeeee;
  --muted:      #8a8c99;
  --ok:         #4caf50;
  --warn:       #e09b0e;
  --bad:        #e05050;
  --accent:     #3d6ab5;
  --btn:        #2c2e3a;
  --btn-border: #3e4050;
  --btn-hover:  #353748;
  --btn-active: #1e2028;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font: 12px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 6px;
  min-width: 220px;
}

/* ── Collapsible group ── */
.group {
  border: 1px solid var(--border);
  border-radius: 2px;
  margin-bottom: 5px;
  overflow: hidden;
}

.group-title {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 8px;
  background: var(--surface);
  cursor: pointer;
  user-select: none;
  font-size: 11px;
}
.group-title:hover { background: #2d2f3c; }

.group-title .label {
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--muted);
  text-transform: uppercase;
  flex: 1;
}

.chevron {
  display: inline-block;
  font-style: normal;
  font-size: 9px;
  color: var(--muted);
  transition: transform .15s;
}
.group.open .chevron { transform: rotate(90deg); }

.group-body {
  display: none;
  padding: 8px;
  border-top: 1px solid var(--border);
  background: var(--bg);
}
.group.open .group-body { display: block; }

/* ── Status dot ── */
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-dot.ok   { background: var(--ok);   box-shadow: 0 0 5px var(--ok); }
.status-dot.warn { background: var(--warn); box-shadow: 0 0 5px var(--warn); }
.status-dot.bad  { background: var(--bad); }

.status-text { font-size: 11px; flex: 1; }

/* ── Detail rows inside status panel ── */
.detail-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 5px;
}
.detail-row:last-child { margin-bottom: 0; }
.detail-row label { font-size: 11px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.detail-value {
  font-size: 11px;
  color: var(--text);
  text-align: right;
  flex: 1;
  word-break: break-all;
}
.detail-value.ok   { color: var(--ok); }
.detail-value.warn { color: var(--warn); }
.detail-value.bad  { color: var(--bad); }

/* ── Rows ── */
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 6px;
}
.row:last-child { margin-bottom: 0; }
.row label { font-size: 11px; color: var(--muted); white-space: nowrap; }

/* ── Selects ── */
select {
  background: var(--btn);
  color: var(--text);
  border: 1px solid var(--btn-border);
  border-radius: 2px;
  padding: 3px 6px;
  font: inherit;
  outline: none;
  min-width: 0;
  flex: 1;
}
select:focus { border-color: var(--accent); }
select:disabled { opacity: .4; cursor: not-allowed; }

/* ── Buttons ── */
button {
  background: var(--btn);
  color: var(--text);
  border: 1px solid var(--btn-border);
  border-radius: 2px;
  padding: 4px 10px;
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
  outline: none;
}
button:hover  { background: var(--btn-hover); }
button:active { background: var(--btn-active); }

#followBtn {
  min-width: 90px;
  font-weight: 600;
  font-size: 11px;
}
#followBtn.following {
  background: #1a3d20;
  border-color: #2a6b35;
  color: var(--ok);
}

/* ── Card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 8px;
  margin-bottom: 5px;
}

/* ── Countdown card ── */
.cd-card {
  display: none;
  text-align: center;
  padding: 10px 8px 8px;
}
.cd-card.visible { display: block; }

#cdTime {
  display: block;
  font-size: 28px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  margin-bottom: 4px;
}

#cdDesc {
  font-size: 10px;
  color: var(--muted);
  line-height: 1.3;
  margin-bottom: 7px;
}

.progress-track {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width .18s linear;
}

</style>
</head>
<body>

<!-- Countdown -->
<div class="card cd-card" id="cdCard">
  <span id="cdTime">0:00</span>
  <div id="cdDesc"></div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
</div>

<!-- Status (collapsible detail panel) -->
<div class="group" id="statusGroup">
  <div class="group-title" id="statusToggle">
    <div class="status-dot bad" id="statusDot"></div>
    <span class="status-text" id="statusText">Connecting…</span>
    <i class="chevron">▶</i>
  </div>
  <div class="group-body">
    <div class="detail-row">
      <label>OBS</label>
      <span id="obsDetail" class="detail-value">—</span>
    </div>
    <div class="detail-row">
      <label>ATEM</label>
      <span id="atemDetail" class="detail-value">—</span>
    </div>
    <div class="detail-row">
      <label>OBS input</label>
      <span id="inputDetail" class="detail-value">—</span>
    </div>
  </div>
</div>

<!-- Controls -->
<div class="card">
  <div class="row">
    <label>Follow ATEM</label>
    <button id="followBtn" class="following">Following</button>
  </div>
  <div class="row">
    <label>When clip ends</label>
    <select id="endAction">
      <option value="__looping__" disabled>Looping video</option>
      <option value="atem_cut_to_preview">ATEM cuts to preview</option>
      <option value="obs_cut_to_preview">OBS cuts to preview</option>
      <option value="nothing">Nothing</option>
    </select>
  </div>
</div>


<script>
const $ = id => document.getElementById(id);

let ws;
let followState = false;

function send(action, value) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action, value }));
}

function fmtTime(ms) {
  if (ms == null || ms < 0) return '—';
  const s = Math.ceil(ms / 1000);
  const m = Math.floor(s / 60);
  return `${m}:${String(s % 60).padStart(2, '0')}`;
}

function onMessage({ data }) {
  const msg = JSON.parse(data);
  if (msg.type === 'event') return;
  if (msg.type !== 'status') return;
  const s = msg.status;

  // ── Status header ──
  const dot = $('statusDot'), txt = $('statusText');
  if (!s.obs.connected) {
    dot.className = 'status-dot bad'; txt.textContent = 'OBS not connected';
  } else if (!s.atem.connected) {
    dot.className = 'status-dot bad'; txt.textContent = 'ATEM not connected';
  } else if (!s.obs.studioMode) {
    dot.className = 'status-dot warn'; txt.textContent = 'Enable Studio Mode in OBS';
  } else if (s.obsAtemInput == null) {
    dot.className = 'status-dot warn'; txt.textContent = 'OBS input not configured';
  } else {
    dot.className = 'status-dot ok';
    txt.textContent = s.following ? 'Following ATEM' : 'Ready — paused';
  }

  // ── Detail rows ──
  const obsAddr = s.obs.address || '—';
  const obsEl = $('obsDetail');
  obsEl.textContent = obsAddr;
  obsEl.className = 'detail-value ' + (s.obs.connected ? 'ok' : 'bad');

  const atemAddr = s.atem.ip || '—';
  const atemEl = $('atemDetail');
  atemEl.textContent = atemAddr;
  atemEl.className = 'detail-value ' + (s.atem.connected ? 'ok' : (s.atem.ip ? 'bad' : ''));

  const inp = s.atem.inputs?.find(i => i.id === s.obsAtemInput);
  $('inputDetail').textContent = s.obsAtemInput == null ? '—'
    : inp ? `${inp.id} — ${inp.name}` : String(s.obsAtemInput);

  // ── Controls ──
  followState = s.following;
  $('followBtn').textContent = s.following ? 'Following' : 'Paused';
  $('followBtn').classList.toggle('following', s.following);

  if (s.hasLooping) {
    $('endAction').value    = '__looping__';
    $('endAction').disabled = true;
  } else {
    $('endAction').value    = s.endAction;
    $('endAction').disabled = false;
  }

  // ── Countdown ──
  $('cdCard').classList.toggle('visible', !!s.playing);
  if (s.playing) {
    if (s.hasLooping) {
      $('cdTime').textContent = '∞';
      $('cdDesc').textContent = 'Looping';
      $('progressFill').style.width = '100%';
    } else if (s.endAction !== 'nothing' && s.media?.durationMs > 0) {
      const earlyMs = s.media.earlyMs || 0;
      const rem = Math.max(0, (s.media.durationMs - s.media.cursorMs) - earlyMs);
      $('cdTime').textContent = fmtTime(rem);
      $('cdDesc').textContent = s.endAction === 'atem_cut_to_preview'
        ? '→ ATEM preview'
        : '→ OBS preview';
      const effectiveDuration = s.media.durationMs - earlyMs;
      const pct = Math.min(100, Math.max(0, s.media.cursorMs / effectiveDuration * 100));
      $('progressFill').style.width = (100 - pct) + '%';
    } else {
      $('cdTime').textContent = '—';
      $('cdDesc').textContent = '';
      $('progressFill').style.width = '0%';
    }
  }
}

function wsConnect() {
  ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = onMessage;
  ws.onclose = () => {
    $('statusDot').className = 'status-dot bad';
    $('statusText').textContent = 'Reconnecting…';
    $('cdCard').classList.remove('visible');
    setTimeout(wsConnect, 3000);
  };
}

$('statusToggle').onclick = () => $('statusGroup').classList.toggle('open');
$('followBtn').onclick = () => send('setFollowing', !followState);
$('endAction').onchange = e => send('setEndAction', e.target.value);

wsConnect();
</script>
</body>
</html>
